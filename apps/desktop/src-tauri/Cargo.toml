[package]
name = "pulsebench-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "PulseBench desktop application (Tauri 2 shell around the shared PulseBench service)"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dependencies]
pulsebench-app = { version = "0.1.0", path = "../../../crates/app" }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
