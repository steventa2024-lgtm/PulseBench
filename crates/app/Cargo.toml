[package]
name = "pulsebench-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
pulsebench-core = { version = "0.1.0", path = "../benchmark-core" }
pulsebench-providers = { version = "0.1.0", path = "../providers" }
pulsebench-sandbox = { version = "0.1.0", path = "../sandbox" }
pulsebench-scoring = { version = "0.1.0", path = "../scoring" }
pulsebench-storage = { version = "0.1.0", path = "../storage" }
pulsebench-telemetry = { version = "0.1.0", path = "../telemetry" }
pulsebench-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync", "fs"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
