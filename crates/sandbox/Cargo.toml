[package]
name = "pulsebench-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
pulsebench-types = { version = "0.1.0", path = "../types" }
serde_json = "1.0.151"
sha2 = "0.10.9"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "process", "macros", "io-util", "fs"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["v4"] }
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
