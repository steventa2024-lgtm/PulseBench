[package]
name = "pulsebench-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive", "env"] }
pulsebench-app = { version = "0.1.0", path = "../app" }
pulsebench-core = { version = "0.1.0", path = "../benchmark-core" }
pulsebench-sandbox = { version = "0.1.0", path = "../sandbox" }
pulsebench-types = { version = "0.1.0", path = "../types" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "pulsebench"
path = "src/main.rs"

[dev-dependencies]
axum = "0.8.9"
pulsebench-storage = { path = "../storage" }
pulsebench-types = { path = "../types" }
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1.53.2", features = ["full"] }
